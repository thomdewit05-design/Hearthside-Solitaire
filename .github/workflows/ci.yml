name: CI

on:
  push:
  pull_request:

jobs:
  packages-linux:
    name: Core & services tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v5
      - name: HearthsideCore
        run: swift test --package-path Packages/HearthsideCore --enable-code-coverage
      - name: GameServices
        run: swift test --package-path Packages/GameServices
      - name: DealGen builds
        run: swift build --package-path Tools/DealGen -c release

  localization:
    name: Localization keys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check strings
        run: python3 Tools/check_strings.py

  app-ios:
    name: App build & tests (iOS simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Tools
        run: brew install xcodegen swiftlint
      - name: Lint
        run: swiftlint --strict
      - name: Generate project
        run: xcodegen generate
      - name: Test
        run: |
          xcodebuild test -project Hearthside.xcodeproj -scheme Hearthside \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            -skipPackagePluginValidation -skipMacroValidation CODE_SIGNING_ALLOWED=NO
