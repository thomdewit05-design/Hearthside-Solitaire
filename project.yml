          - SKAdNetworkIdentifier: 3qcr597p9d.skadnetwork
    entitlements:
      path: Hearthside/Hearthside.entitlements
      properties:
        com.apple.developer.game-center: true
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    dependencies:
      - package: HearthsideCore
      - package: GameServices
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseAnalytics
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: Firebase
        product: FirebaseCrashlytics
      - sdk: GameKit.framework
      - sdk: StoreKit.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hearthside.app # plan: com.<jouwstudio>.hearthside
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: -ObjC
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
    preBuildScripts:
      - name: SwiftLint
        basedOnDependencyAnalysis: false
        script: |
          export PATH="$PATH:/opt/homebrew/bin"
          if which swiftlint > /dev/null; then swiftlint --config "${SRCROOT}/.swiftlint.yml"; else echo "warning: SwiftLint not installed"; fi
    postBuildScripts:
      - name: Crashlytics dSYM upload
        basedOnDependencyAnalysis: false
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
        script: |
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "${SRCROOT}/Hearthside/GoogleService-Info.plist" ] && [ -x "$RUN" ]; then "$RUN"; fi

  HearthsideTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HearthsideTests]
    dependencies:
      - target: Hearthside
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Hearthside:
    build:
      targets:
        Hearthside: all
    run:
      config: Debug
      storeKitConfiguration: Hearthside/Resources/Hearthside.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HearthsideTests
        - package: HearthsideCore/HearthsideCoreTests
        - package: GameServices/GameServicesTests
    archive:
      config: Release
